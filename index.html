<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Play One?! 是一個讓朋友快速揪團、選時段、看誰能加入的小工具。"
    />
    <title>Play One?! | 揪團大廳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="glow glow--one"></div>
    <div class="glow glow--two"></div>

    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand__icon" aria-hidden="true">P1</span>
        <span>
          <strong>Play One?!</strong>
          <small>朋友揪團時間板</small>
        </span>
      </a>
      <nav class="nav" aria-label="主要導覽">
        <a class="nav__link" href="#/">大廳</a>
        <button class="admin-trigger" id="admin-button" type="button" title="管理模式" aria-label="管理模式">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z" />
            <path d="M19.4 15a7.8 7.8 0 0 0 .06-1 7.8 7.8 0 0 0-.06-1l2.02-1.58-1.9-3.28-2.38.96a7.9 7.9 0 0 0-1.73-1L15.05 5h-3.8l-.36 3.1a7.9 7.9 0 0 0-1.73 1l-2.38-.96-1.9 3.28L6.9 13a7.8 7.8 0 0 0-.06 1c0 .34.02.68.06 1l-2.02 1.58 1.9 3.28 2.38-.96c.53.42 1.11.76 1.73 1l.36 3.1h3.8l.36-3.1c.62-.24 1.2-.58 1.73-1l2.38.96 1.9-3.28L19.4 15Z" />
          </svg>
        </button>
        <a class="button button--primary button--small" href="#/new">+ 開新團</a>
      </nav>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="footer">
      <p>Play One?! demo version <span aria-hidden="true">/</span> 目前可接 Supabase 雲端同步</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="assertive"></div>

    <template id="lobby-template">
      <section class="hero">
        <div class="hero__copy">
          <span class="eyebrow">PLAY INVITATION</span>
          <h1>今天玩什麼，<span>一眼就知道。</span></h1>
          <p>開團、選時段、收朋友回覆。大廳會依台灣時間把現在可加入、快開始、今晚稍晚的團排好。</p>
          <div class="hero__actions">
            <a class="button button--primary" href="#/new">開一個新團</a>
            <a class="button button--ghost" href="#invites">看目前揪團</a>
          </div>
        </div>
        <div class="hero-card" aria-label="熱門時段預覽">
          <div class="hero-card__header">
            <span class="live-dot"></span>
            <span>今晚熱門時段</span>
          </div>
          <p class="hero-card__topic" id="hero-tonight-title">整理中...</p>
          <div class="avatars" id="hero-avatars" aria-label="參與者預覽"></div>
          <div class="hero-card__slot">
            <small>最多人可加入</small>
            <strong id="hero-best-slot">--</strong>
          </div>
        </div>
      </section>

      <section class="tonight-panel" aria-labelledby="tonight-title">
        <div>
          <span class="eyebrow">TONIGHT</span>
          <h2 id="tonight-title">今晚開的團</h2>
        </div>
        <div class="tonight-list" id="tonight-list"></div>
      </section>

      <section class="lobby" id="invites">
        <div class="section-head">
          <div>
            <span class="eyebrow">LOBBY</span>
            <h2>揪團大廳</h2>
          </div>
          <div class="filters" aria-label="篩選揪團">
            <button class="filter is-active" data-filter="upcoming">現在可以加入</button>
            <button class="filter" data-filter="tonight">今晚開的團</button>
            <button class="filter" data-filter="all">全部</button>
          </div>
        </div>
        <div class="invite-grid" id="invite-grid"></div>
      </section>
    </template>

    <template id="new-template">
      <section class="form-page">
        <div class="form-page__intro">
          <a class="back-link" href="#/">返回大廳</a>
          <span class="eyebrow">NEW INVITATION</span>
          <h1>開一個新團</h1>
          <p>先丟出幾個你可以的時間，朋友加入後，頁面會自動統計哪些時段最多人能玩。</p>
          <aside class="tip-card">
            <strong>資料同步提醒</strong>
            <p>目前預設會存在這台裝置。若填入 Supabase 設定，朋友在不同設備打開同一個頁面也會看到最新資料。</p>
          </aside>
        </div>

        <form class="create-form card" id="create-form">
          <label class="field field--full">
            <span>團名 <b>*</b></span>
            <input name="title" required maxlength="50" value="今晚有人要一起玩嗎？" />
          </label>
          <label class="field">
            <span>團主大人 <b>*</b></span>
            <input name="host" required maxlength="18" placeholder="你的暱稱" />
          </label>
          <label class="field">
            <span>常用遊戲 / 活動</span>
            <span class="select-wrap">
              <select name="game" id="game-select">
                <optgroup label="手機">
                  <option value="Pastale (追殺蠟筆)">Pastale (追殺蠟筆)</option>
                  <option value="Family Style (合作煮飯)">Family Style (合作煮飯)</option>
                  <option value="WePlay-動次打次拳">WePlay-動次打次拳</option>
                  <option value="WePlay-誰是臥底">WePlay-誰是臥底</option>
                  <option value="WePlay-你話我猜">WePlay-你話我猜</option>
                </optgroup>
                <optgroup label="電腦">
                  <option value="Steam-猛獸派對">Steam-猛獸派對</option>
                  <option value="Steam-PICO PARK (貓咪合作吵架)">Steam-PICO PARK (貓咪合作吵架)</option>
                  <option value="Steam-煙雲十六聲">Steam-煙雲十六聲</option>
                  <option value="Steam-煮過頭">Steam-煮過頭</option>
                </optgroup>
                <optgroup label="Switch">
                  <option value="Switch-煮過頭">煮過頭</option>
                </optgroup>
              </select>
            </span>
          </label>
          <label class="field" id="custom-game-field">
            <span>清單沒有才填</span>
            <input name="customGame" maxlength="24" placeholder="例如羽球、桌遊、唱歌" />
            <small class="field-hint">上面選單找不到要揪的遊戲或活動時，再填這格</small>
          </label>
          <label class="field field--full">
            <span>日期 <b>*</b></span>
            <input name="date" id="event-date" type="date" required />
          </label>
          <fieldset class="slot-field field--full">
            <legend>可以玩的時段 <b>*</b></legend>
            <div class="slot-options" id="slot-options">
              <label class="slot-choice"><input type="checkbox" name="slots" value="18:00 - 19:00" /><span>18:00 - 19:00</span></label>
              <label class="slot-choice"><input type="checkbox" name="slots" value="19:00 - 21:00" checked /><span>19:00 - 21:00</span></label>
              <label class="slot-choice"><input type="checkbox" name="slots" value="21:00 - 22:00" /><span>21:00 - 22:00</span></label>
              <label class="slot-choice"><input type="checkbox" name="slots" value="22:00 之後" checked /><span>22:00 之後</span></label>
            </div>
            <div class="custom-slot">
              <input id="custom-slot" maxlength="25" placeholder="新增時段，例如 23:30 之後" />
              <button class="button button--secondary button--small" id="add-slot" type="button">加入</button>
            </div>
            <p class="error" id="slot-error"></p>
          </fieldset>
          <label class="field field--full">
            <span>備註</span>
            <textarea name="note" rows="3" maxlength="160" placeholder="例如：Discord 集合、缺補位、輕鬆玩"></textarea>
          </label>
          <button class="button button--primary button--wide" type="submit">送出揪團</button>
        </form>
      </section>
    </template>

    <template id="detail-template">
      <section class="detail-page">
        <a class="back-link" href="#/">返回揪團大廳</a>
        <div class="detail-layout">
          <article class="invitation card" id="invitation"></article>
          <section class="join-card card">
            <h2>加入這團</h2>
            <form id="join-form">
              <label class="field field--full">
                <span>你的暱稱 <b>*</b></span>
                <input required name="nickname" maxlength="18" placeholder="朋友看得到的名字" />
              </label>
              <fieldset class="slot-field field--full">
                <legend>你可以的時段 <b>*</b></legend>
                <div class="join-options" id="join-options"></div>
                <p class="error" id="join-error"></p>
              </fieldset>
              <label class="field field--full">
                <span>留言</span>
                <input name="message" maxlength="60" placeholder="例如：我會晚一點、可以補位" />
              </label>
              <button class="button button--primary button--wide" type="submit">送出我的時間</button>
            </form>
          </section>
        </div>
      </section>
    </template>
  </body>
</html>
